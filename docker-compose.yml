# Local development: API and UI as two services (same image as the single-container demo).
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    # Ollama running on your machine: reachable from the container at this address
    extra_hosts: ["host.docker.internal:host-gateway"]

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
